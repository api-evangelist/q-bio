aid: q-bio
name: Q Bio
description: >-
  Q Bio is a Redwood City, California health-technology company offering the Q Exam and the Q Bio
  Health Dashboard, sold directly at its clinic and through enterprise partners. The Q Exam is a
  comprehensive preventive-health assessment that combines whole-body non-contrast MRI, 120+ blood
  biomarkers, analysis of 163 risk-relevant genes, wearable data, medical history, and board-certified
  physician review into a single longitudinal health baseline. Imaging is quantified by Constellation,
  the company's FDA-cleared AI image-analysis software that segments organs and measures anatomy, and
  results are stored in the Q Bio Health Dashboard for year-over-year comparison. Q Bio is a portfolio
  company of a16z. As of this enrichment pass the company publishes no public developer portal, API,
  documentation, or well-known discovery surface.
